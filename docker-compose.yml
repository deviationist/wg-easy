volumes:
  etc_wireguard:

services:
  wg-easy:
    #environment:
    #  Optional:
    #  - PORT=51821
    #  - HOST=0.0.0.0
    #  - INSECURE=false

    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Required if you set `cap_drop: [ALL]` (Docker's default cap set
      #            includes NET_RAW, so it's implicit otherwise). Also required under
      #            rootful Podman, which does not include NET_RAW by default.
    # ⚠️ Optional hardening — opt-in. See docs/advanced/config/hardening.md.
    # Drops Linux capabilities the wg-easy process does not need, and runs the
    # server as an unprivileged user (UID 911) instead of root. Requires the
    # host to preload the `wireguard` kernel module if SYS_MODULE is also dropped.
    #
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    #   - SYS_MODULE  # remove if the host preloads the wireguard module
    # security_opt:
    #   - no-new-privileges:true
    # environment:
    #   - DROP_PRIVILEGES=true
    #   - PUID=911            # optional, override to match a host UID for bind-mounts
    #   - PGID=911
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
